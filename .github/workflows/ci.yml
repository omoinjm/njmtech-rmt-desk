name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o bin/ ./cmd/...
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - name: macOS 11 compatibility (deployment target, no hard ScreenCaptureKit link)
        if: runner.os == 'macOS'
        run: packaging/macos/check-compat.sh bin/rmtd bin/rmt

      # The desktop app only really compiles with Wails' build tags (without
      # them it builds a stub), which need the platform web view headers.
      - name: Desktop app (Linux, WebKitGTK 4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
          go build -tags desktop,production,webkit2_41 -o /dev/null ./cmd/rmt-desk
      - name: Desktop app (Windows)
        if: runner.os == 'Windows'
        run: go build -tags desktop,production -o NUL ./cmd/rmt-desk
      - name: Desktop app (macOS)
        if: runner.os == 'macOS'
        # What the Wails CLI adds itself on macOS 11+ (file dialogs use UTType).
        env:
          CGO_LDFLAGS: -framework UniformTypeIdentifiers -mmacosx-version-min=10.13
        run: go build -tags desktop,production -o /dev/null ./cmd/rmt-desk
