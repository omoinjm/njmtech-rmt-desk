# Publishes the web viewer (cmd/rmt-web as WebAssembly + the normal UI) to
# GitHub Pages. It's a static client: it only works for someone who signs in
# to a tailnet with rmt-desk hosts on it.
name: pages
on:
  push:
    branches: [main, web-viewer]
    paths:
      - cmd/rmt-web/**
      - internal/**
      - packaging/web/**
      - go.mod
      - go.sum
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build web viewer
        run: packaging/web/build.sh dist/web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
